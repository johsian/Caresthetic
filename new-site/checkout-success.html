<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <title>Confirmación de pago | Caresthetic</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
  <style>
    :root { color-scheme: dark; --gold: #e2c3b1; --line: rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 50% 15%, rgba(226,195,177,.14), transparent 35%),
        #050505;
      color: #fff;
      font-family: 'Jost', system-ui, sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid var(--line);
      border-radius: 2rem;
      background: rgba(255,255,255,.035);
      box-shadow: 0 28px 90px rgba(0,0,0,.4);
      text-align: center;
    }
    .status-icon {
      display: inline-flex;
      width: 70px;
      height: 70px;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(226,195,177,.45);
      border-radius: 50%;
      color: var(--gold);
      font-size: 2rem;
    }
    .eyebrow { margin: 0 0 .75rem; color: var(--gold); font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0 0 1rem; font-family: 'Bodoni Moda', Georgia, serif; font-size: clamp(2.1rem, 7vw, 3.7rem); line-height: 1.05; }
    p { margin: 0 auto 1rem; max-width: 28rem; color: rgba(255,255,255,.62); line-height: 1.7; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 1.25rem;
      padding: .8rem 1.5rem;
      border-radius: 999px;
      background: var(--gold);
      color: #050505;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="status-icon" aria-hidden="true"><i class="ri-loader-4-line" id="status-icon"></i></div>
    <p class="eyebrow" id="eyebrow">Verificando pago</p>
    <h1 id="title">Un momento…</h1>
    <p id="message">Estamos confirmando tu transacción de forma segura.</p>
    <p id="email-message" hidden></p>
    <a class="button" href="/tizo" id="return-link" hidden>Volver a TiZO</a>
  </main>
  <script>
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('session_id');
      var icon = document.getElementById('status-icon');
      var eyebrow = document.getElementById('eyebrow');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var emailMessage = document.getElementById('email-message');
      var returnLink = document.getElementById('return-link');

      function showError(text) {
        icon.className = 'ri-error-warning-line';
        eyebrow.textContent = 'No se pudo confirmar';
        title.textContent = 'Revisa tu pago';
        message.textContent = text;
        returnLink.hidden = false;
      }

      if (!sessionId) {
        showError('No encontramos una sesión de pago válida.');
        return;
      }

      try {
        var response = await fetch('/api/checkout-session?session_id=' + encodeURIComponent(sessionId));
        var data = await response.json();
        if (!response.ok || data.paymentStatus !== 'paid') {
          throw new Error(data.message || 'El pago aún no aparece como completado.');
        }

        window.localStorage.removeItem('caresthetic_cart_v1');
        icon.className = 'ri-check-line';
        eyebrow.textContent = 'Pago confirmado';
        title.textContent = 'Gracias por tu compra';
        message.textContent = 'Tu orden de productos TiZO fue recibida. Caresthetic se comunicará contigo para coordinar el recogido.';
        if (data.customerEmail) {
          emailMessage.textContent = 'Enviamos la confirmación a ' + data.customerEmail + '.';
          emailMessage.hidden = false;
        }
        returnLink.hidden = false;
      } catch (error) {
        showError(error.message || 'No pudimos verificar el pago en este momento.');
      }
    })();
  </script>
</body>
</html>
