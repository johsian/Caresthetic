<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — Caresthetic</title>
<meta name="description" content="Hemos recibido tu solicitud de consulta. El equipo de Caresthetic se comunicará contigo pronto.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://carestheticpr.com/gracias.html">
<link rel="icon" type="image/png" sizes="480x480" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #E2C3B1; --gold-light: #C7AC9C; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, #1a1512 0%, #000 70%);
    color: #fff;
    font-family: 'Jost', system-ui, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  .card { max-width: 560px; }
  .logo { height: 3rem; width: auto; margin-bottom: 2.5rem; }
  .label {
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 1.25rem;
  }
  h1 {
    font-family: 'Bodoni Moda', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.1;
    margin: 0 0 1.25rem;
  }
  p.copy {
    color: rgba(255,255,255,0.55);
    font-weight: 300;
    line-height: 1.85;
    font-size: 1.02rem;
    margin: 0 auto 2.5rem;
    max-width: 460px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--gold);
    color: #000;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.82rem;
    padding: 1rem 2.6rem;
    border-radius: 999px;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .contact {
    margin-top: 2.25rem;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em;
  }
  .contact a { color: rgba(255,255,255,0.6); text-decoration: none; }
  .contact a:hover { color: var(--gold); }
</style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="Caresthetic" class="logo">
    <p class="label">Solicitud recibida</p>
    <h1>Gracias por escribirnos</h1>
    <p class="copy">
      Hemos recibido tu solicitud de consulta. Nuestro equipo se comunicará contigo
      muy pronto para coordinar tu cita en un horario conveniente.
    </p>
    <a href="/" class="btn">Volver al inicio</a>
    <p class="contact">
      ¿Necesitas ayuda inmediata? <a href="tel:7874688050">787.468.8050</a> ·
      <a href="mailto:booking@carestheticpr.com">booking@carestheticpr.com</a>
    </p>
  </main>
</body>
</html>
